# Compila el APK de Emonic Lava en los servidores de GitHub (sin WSL).
# preparar_movil.ps1 copia este archivo a subir_a_github/.github/workflows/
# Se ejecuta cada vez que subes cambios, o a mano desde la pestaña "Actions" (Run workflow).
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir la app (emonic_app.zip)
        run: |
          ZIP=$(find . -name emonic_app.zip -not -path "./app/*" | head -n 1)
          if [ -z "$ZIP" ]; then echo "No encuentro emonic_app.zip en el repositorio"; exit 1; fi
          echo "Usando $ZIP"
          mkdir -p app
          unzip -o "$ZIP" -d app
          ls -la app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache gettext autopoint libltdl-dev

      - name: Instalar Buildozer
        run: pip install --upgrade buildozer "Cython==0.29.33" setuptools virtualenv

      - name: "Caché de Buildozer (SDK y NDK, acelera las siguientes compilaciones)"
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            app/.buildozer
          key: buildozer-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: buildozer-

      - name: Compilar (la primera vez tarda 30-60 min)
        working-directory: app
        # Las licencias del SDK se aceptan en buildozer.spec (android.accept_sdk_license).
        # Si falla, las últimas líneas del registro se publican como aviso (visible sin iniciar sesión).
        run: |
          set +e
          buildozer android debug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g; s/\r//g' build.log > limpio.log
            # buildozer imprime todas las variables de entorno al final: se corta ahí
            n=$(grep -n "ENVIRONMENT:" limpio.log | head -n 1 | cut -d: -f1)
            if [ -n "$n" ]; then head -n $((n - 1)) limpio.log > antes.log; else cp limpio.log antes.log; fi
            avisar() {   # GitHub corta cada aviso en 4096 caracteres
              msg=$(tail -c 3800 "$1" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=$2::$msg"
            }
            grep -iE "error|traceback|exception|failed|no such file|not found|undefined" antes.log | tail -n 30 > errores.log
            tail -n 45 antes.log > final.log
            avisar errores.log "Lineas con error"
            avisar final.log "Final del registro"
          fi
          exit $code

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: EmonicLava-apk
          path: app/bin/*.apk
          if-no-files-found: error
